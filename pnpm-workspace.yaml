# nosemgrep: package_managers.pnpm.pnpm-block-exotic-sub-dependencies.pnpm-block-exotic-sub-dependencies,package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age,package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy -- 供給網強化設定は pnpm バージョン互換の確認後に導入判断（推奨系ルール・脆弱性ではない）
packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  msw: false

minimumReleaseAgeExclude:
  - lucide-react@1.22.0
